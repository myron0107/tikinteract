<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikInteract — variante Dark Mode</title><link rel="stylesheet" href="../../assets/fonts/font-faces.css"><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#F3F3F5;color:#202026;font:14px Inter,Arial,sans-serif}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 10px}body>p{color:#666;margin:0 0 28px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.option{min-width:0;border:1px solid #DADAE0;border-radius:14px;overflow:hidden;background:#FFF}.copy{padding:22px}.copy h2{font-size:20px;margin:0 0 8px;letter-spacing:-.03em}.copy p{font-size:13px;line-height:1.6;margin:0;color:#65656E}.swatches{display:flex;gap:10px;margin-top:18px}.swatches span{display:flex;flex:1;flex-direction:column;gap:6px;font-size:11px;color:#666}.swatches i{display:block;width:100%;height:32px;border-radius:6px;border:1px solid #0001}.window{width:100%;height:620px;position:relative;overflow:hidden;background:var(--bg)}iframe{width:1440px;height:1800px;border:0;transform-origin:top left;transform:scale(var(--scale,.4));pointer-events:none}.note{margin-top:22px;font-size:12px;color:#666}@media(max-width:900px){.options{grid-template-columns:1fr}.window{height:560px}.option{max-width:650px;width:100%;margin:auto}}
</style></head><body><h1>Dark Mode, puțin mai luminos.</h1><p>Aceleași pagini și același Burgundy. Se schimbă doar nuanțele de fundal și panourile.</p><main class="options"></main><p class="note">Previzualizare de culori. Accentele, logo-ul și funcțiile platformei sunt păstrate.</p><script>
const options=[{id:'A',name:'Negru catifelat',text:'O deschidere discretă față de varianta actuală.',bg:'#101014',panel:'#18181E',soft:'#202027'},{id:'B',name:'Antracit',text:'Mai luminos, cu o separare clară între panouri.',bg:'#15151B',panel:'#1E1E25',soft:'#272730'},{id:'C',name:'Grafit',text:'Cea mai deschisă variantă, cu contrast mai blând.',bg:'#1B1B22',panel:'#25252D',soft:'#30303A'}];
for(const o of options){const card=document.createElement('section');card.className='option';card.style.setProperty('--bg',o.bg);card.innerHTML='<div class="copy"><h2>'+o.id+' · '+o.name+'</h2><p>'+o.text+'</p><div class="swatches">'+[o.bg,o.panel,o.soft,'#A30F3D'].map((hex,i)=>'<span><i style="background:'+hex+'"></i>'+['Fundal','Panou','Element','Burgundy'][i]+'<b>'+hex+'</b></span>').join('')+'</div></div><div class="window"><iframe title="Varianta '+o.id+'" src="../../index.html"></iframe></div>';document.querySelector('main').append(card);const frame=card.querySelector('iframe');frame.onload=()=>{const w=frame.contentWindow;w.TikInteractAppearance?.set('dark');w.TikInteractHomeReel?.pause();const style=w.document.createElement('style');style.textContent='html[data-mode=dark] body#tikinteract-site.public-approved{--public-bg:'+o.bg+';--public-panel:'+o.panel+';--public-soft:'+o.soft+';--public-line:#FFFFFF20;--ticket-surround:'+o.bg+'}';w.document.head.append(style);frame.dataset.ready='true';};const fit=()=>card.style.setProperty('--scale',card.querySelector('.window').clientWidth/1440);new ResizeObserver(fit).observe(card);fit();}
</script></body></html>
