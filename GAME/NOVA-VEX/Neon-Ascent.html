<!-- Standalone review build of SkyShift 0.7.0. Generated from the modular LAH source.
SkyShift artwork and original audio, 2026-10-08.

Atlas and sky background: original images generated with OpenAI's built-in
image generator for LiveArcadeHub. No competitor artwork was used.
WebP format conversion preserves dimensions and generated atlas transparency.
Sprite bounds are metadata; the atlas itself has not been cut into image files.
Cover: screenshot of the actual SkyShift runtime using these assets.

skyshift-theme.mp3:
original audio rendered by qa/render-audio.py for this project, then encoded
with ffmpeg. No external song or recording is used in this original theme.

power-up.mp3, drop.mp3, coin.mp3, win.mp3, switch.mp3:
compatibility renditions of the canonical LAH Kenney CC0 clips; full notices
in kenney-interface.txt and kenney-digital.txt.

Fredoka: SIL Open Font License 1.1, see fredoka.txt.

positive.webp and negative.webp (2026-10-09 Europe/Bucharest):
original backgrounds generated with OpenAI built-in image generation for
SkyShift. No competitor artwork was supplied. Full prompts in
qa/background-prompts.json. Original canvas balloon and cloth flag
illustrations are authored for this game in src/render.js.

anvil.webp and meteor.webp (2026-10-08 UTC):
original transparent props generated with OpenAI built-in image generation,
trimmed and converted to 640px-wide WebP with transparency retained.
Exact briefs in qa/prop-prompts.json. No competitor artwork was supplied.

Downloaded gift audio (0.5): see gift-audio.txt and qa/audio-downloads.json.
The former original wind/attraction/air-drop beds have been replaced in the
runtime with downloaded samples.

0.6 runtime replacements (2026-10-08 UTC):
bg-earth.webp, bg-grass.webp, bg-clouds.webp, bg-space.webp,
bg-cosmos.webp, bg-lava.webp, bg-crystal.webp, bg-abyss.webp:
eight original backgrounds created with the built-in OpenAI image generator.
Converted to 720x1080 WebP, quality 78. The older sky/positive/negative art is
no longer in the public runtime manifest. Full briefs and source PNG names
are recorded in qa/art-prompts-v6.json.

blast.webp: original transparent meteor explosion created with the same
built-in generator, converted to 640x533 WebP with alpha retained.
Original native animated impact fragments are drawn in src/meteor.js.

meteor-crunch.mp3: an additional Kenney Sci-Fi Sounds CC0 recording.
Source: Audio/explosionCrunch_001.ogg. Edits and attribution in
qa/audio-downloads.json and gift-audio.txt. Runtime now contains 17 MP3 files.

SkyShift 0.7 win shows, 2026-10-09.

alien-rig.webp and alien-ship.webp: original alpha artwork generated with
OpenAI's built-in image generator, using SkyShift's original sprite atlas as
the style reference. Native joint animation is authored in src/wins.js.
Source rectangles are metadata; the six-part atlas is not sliced into files.
WebP format conversion retains alpha and original dimensions. Full prompts
and original PNG names: qa/win-art-prompts.json.

alien-laugh.mp3: Alien cackle by Breviceps, Freesound 447921, CC0-1.0.
https://freesound.org/people/Breviceps/sounds/447921/

champion-fanfare.mp3: Fanfare 3 - Rpg by colorsCrimsonTears,
Freesound 607407, CC0-1.0.
https://freesound.org/people/colorsCrimsonTears/sounds/607407/

Kenney Sci-Fi Sounds, CC0-1.0.
https://kenney.nl/assets/sci-fi-sounds

alien-punch.mp3 and trophy-catch.mp3: Kenney Impact Sounds, CC0-1.0.

:root{font-family:Fredoka,system-ui,sans-serif;color:#183849;color-scheme:light;--ink:#123345;--cream:#fffdf1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:grid;place-items:center;background:#0b0b0e}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #72f1ab;outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
[hidden]{display:none!important}
#stage{position:relative;isolation:isolate;width:min(100vw,calc(100dvh * .5625));height:100dvh;overflow:hidden;box-shadow:0 0 100px #0006;background:#73d8ff;touch-action:none}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%}
#hud{position:absolute;z-index:2;inset:max(18px,env(safe-area-inset-top)) 6% auto;pointer-events:none}
.brand{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;letter-spacing:.22em;color:#f7fdff;text-shadow:0 2px 2px #123d6e,0 0 4px #123d6e}
.brand-mark{font-size:20px;line-height:1;color:#f3ffc3}.brand-dot{width:4px;height:4px;border-radius:50%;background:#b9ff63;box-shadow:0 0 6px #133e54}
.metrics{display:flex;align-items:center;justify-content:center;gap:18px;margin:17px 0 16px;min-height:78px}
.distance-number{display:flex;align-items:baseline;gap:5px;color:var(--cream);paint-order:stroke fill;-webkit-text-stroke:4.3px var(--ink);filter:drop-shadow(0 4px 0 #132a4b88)}
#distance{font-size:clamp(50px,13vw,79px);line-height:1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.unit{font-size:25px;-webkit-text-stroke:2.2px var(--ink)}
.negative{color:#ff8a83}
.distance-number.negative{color:#ff787d;-webkit-text-stroke:5.2px #201b34;filter:drop-shadow(0 4px 0 #111523aa) drop-shadow(0 0 2px #fff3)}
.distance-number.negative .unit{-webkit-text-stroke:2.7px #201b34}
.wins-bubble{display:flex;align-items:center;gap:4px;padding:6px 12px 6px 6px;background:#fff8ebeb;border:2.5px solid #24425e;border-radius:18px;box-shadow:0 4px 0 #12334566,inset 0 1px 0 #fff;color:#795020;min-width:60px}
.wins-bubble canvas{width:30px;height:32px}.wins-bubble strong{font-size:23px;white-space:nowrap}
.wins-bubble.negative-score{color:#ff5d75;background:#fff0efee;border-color:#31243d}
.wins-bubble.negative-score strong{paint-order:stroke fill;-webkit-text-stroke:1.6px #3a2039;text-shadow:0 1px 0 #3a2039}
.wins-bubble.score-gain{box-shadow:0 0 24px #ffe373;border-color:#ffe373}.wins-bubble.score-theft{box-shadow:0 0 23px #a966ff;border-color:#c294ff}
.progress{position:relative;height:37px;border:3px solid #173751;border-radius:20px;background:#fff8e8ed;box-shadow:0 4px 0 #17375188,inset 0 1px 0 #fff}
.progress-track{position:absolute;inset:2px;overflow:hidden;border-radius:15px}
#progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(180deg,#b5ff5a,#61dc31);border-right:2px solid #2c8631;border-radius:14px;box-shadow:inset 0 2px 0 #f1ffae}
#remaining{position:absolute;inset:0;display:grid;place-items:center;padding:0 35px 0 12px;font-size:12px;letter-spacing:.015em;color:#16354b;text-shadow:0 1px 0 #fff9}
.finish-flag{position:absolute;right:-6px;top:-17px;width:44px;height:51px;filter:drop-shadow(0 2px 1px #132e4b44)}
#hud.is-holding .progress{border-color:#ffe174;box-shadow:0 0 23px #ffce63aa,0 4px 0 #a77624}
#dock{position:absolute;z-index:9;left:14px;top:max(15px,env(safe-area-inset-top))}
.dock-button{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(150deg,#f7fcff,#d9eef5);border:3px solid #16354e;color:#24445e;box-shadow:0 4px 0 #12364d77,inset 0 2px 0 #fff}
.dock-button svg{width:28px;height:28px;fill:#436b83;stroke:#effcff;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.dock-button[aria-expanded=true]{background:linear-gradient(140deg,#abffaf,#4ddf83)}.dock-button[aria-expanded=true] svg{transform:rotate(60deg)}
#hud-fx{position:absolute;inset:0;z-index:8;width:100%;height:100%;pointer-events:none}
#game-menu{position:absolute;z-index:9;left:12px;top:max(73px,calc(env(safe-area-inset-top) + 58px));width:min(328px,calc(100% - 24px));max-height:calc(100% - 88px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#537991 transparent;background:linear-gradient(155deg,#193a50f7,#102438f7);border:2px solid #9bcfe083;border-radius:25px;padding:17px;color:#eaf7ff;box-shadow:0 16px 45px #06172888,inset 0 1px 0 #ffffff29;backdrop-filter:blur(18px);touch-action:pan-y}
.menu-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
.menu-title strong{display:block;font-size:24px;letter-spacing:-.035em;color:#f7ffdc}.menu-title small{display:block;font-size:11px;color:#94bacf;margin-top:2px}
#menu-close{display:grid;place-items:center;width:31px;height:31px;background:#ffffff0d;border:1px solid #9ec9d948;border-radius:50%;color:#c8e5f1}#menu-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.menu-actions{display:flex;gap:8px;margin-bottom:13px}
.menu-action{display:flex;flex:1;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border:1px solid #8dbdd247;border-radius:12px;background:#24465d;color:#d2eaf7;font-size:12px}
.menu-action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-action[aria-pressed=true]{background:#5d486c;border-color:#c591c7;color:#ffe6ed}
.menu-tabs{display:flex;gap:5px;padding:4px;margin-bottom:14px;background:#071d2e9c;border:1px solid #91c6d12a;border-radius:14px}
.menu-tabs button{flex:1;padding:10px 5px;border:0;border-radius:10px;background:transparent;color:#94b5cb;font-size:12px}
.menu-tabs button[aria-expanded=true]{background:linear-gradient(145deg,#b0ffb8,#57e294);color:#113d32;box-shadow:0 2px 5px #071b2744}
.panel{margin:0;padding:0;border:0}
.setting-group{margin:0 0 11px;padding:13px 12px;background:#28465b7d;border:1px solid #98cadd28;border-radius:16px}
.setting-group h2{display:flex;align-items:center;gap:7px;margin:0 0 11px;font-size:12px;letter-spacing:.02em;color:#ccf0f8}.setting-group h2 canvas{width:18px;height:21px}
.panel label:not(.switch-row){display:block;font-size:10px;color:#9fc0d1;margin:8px 0 6px}
.panel input:not([type=checkbox]):not([type=range]),.panel select{width:100%;height:39px;border:1px solid #a6cddda3;border-radius:11px;background:#edf7fb;color:#183951;padding:0 10px;font-size:13px;box-shadow:inset 0 2px 3px #11324d11}
.field-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.field-grid>div{display:flex;flex-direction:column}.field-grid label{margin-top:0!important;min-height:2.5em;display:flex!important;align-items:end}.field-grid input{margin-top:auto}
.panel .switch-row{position:relative;display:flex;align-items:center;gap:12px;margin:11px 0 0;min-height:28px;cursor:pointer}.switch-row span{flex:1;min-width:0}.switch-row strong{display:block;font-size:12px;color:#e9f8ff}.switch-row small{display:block;font-size:9px;color:#95b6c9;line-height:1.45;margin-top:3px}
.switch-row input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch{flex:none;position:relative;width:36px;height:22px;border-radius:12px;background:#597283;box-shadow:inset 0 1px 3px #0c263866;pointer-events:none}
.switch:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#d0e6ef;box-shadow:0 1px 3px #0003;transition:transform .18s}
.switch-row input:checked+.switch{background:#64e995}.switch-row input:checked+.switch:after{transform:translateX(14px);background:#f5fff0}.switch-row input:focus-visible+.switch{outline:3px solid #e9ffbe;outline-offset:3px}
.panel .range-label{display:flex!important;align-items:center;justify-content:space-between;margin:13px 0 7px!important}.range-label output{font-size:11px;color:#b2ffbf}
.panel input[type=range]{width:100%;height:18px;margin:0;accent-color:#79f4a1;cursor:pointer;touch-action:pan-x}
.panel select{appearance:auto}.panel #language{margin-bottom:1px}
.apply{display:block;width:100%;margin:12px 0 1px;padding:13px 10px;border:1px solid #b1ffbe;border-radius:14px;background:linear-gradient(140deg,#b9ffbb,#5ee18e);color:#113e31;font-size:12px;box-shadow:0 3px 0 #163b31}
.gift-button:active,.apply:active{transform:translateY(2px)}
#test-panel>h2{display:none}
#gift-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gift-test-fields{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:9px}
.gift-button{display:flex;gap:7px;align-items:center;min-height:59px;padding:7px;border:1px solid #acd4e14a;border-radius:13px;background:linear-gradient(135deg,#2a4c63,#20384c);color:#effbff;text-align:left;box-shadow:0 2px 0 #071d2c66}
.gift-button canvas{width:34px;height:36px;flex:none}.gift-button strong{display:block;font-size:11px}.gift-button small{display:block;font-size:12px;color:var(--accent,#a3efba);margin-top:3px}
#biome{position:absolute;left:6.5%;bottom:18px;font-size:9px;letter-spacing:.11em;color:#fafdff;text-shadow:0 2px 3px #142b58;pointer-events:none}
#queue{position:absolute;right:6.5%;bottom:18px;max-width:48%;font-size:9px;color:#eaf7ff;background:#112c4cd9;border:1px solid #9bcbde83;border-radius:12px;padding:5px 9px;pointer-events:none}
#feed{position:absolute;z-index:4;width:min(365px,88%);max-width:88%;pointer-events:none;display:flex;flex-direction:column;gap:7px}
.gift-card{display:flex;align-items:center;justify-content:center;gap:7px;min-height:62px;animation:card-in .2s ease;color:#fff;filter:drop-shadow(0 2px 0 #11192a99)}
.gift-card canvas{width:57px;height:57px;flex:none;filter:drop-shadow(0 2px 3px #07132188)}.gift-card .copy{min-width:0;max-width:calc(100% - 64px)}
.gift-card b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:2.7px #101522;paint-order:stroke fill;text-shadow:0 2px 0 #111522}
.gift-card .caption{display:flex;align-items:baseline;gap:7px;white-space:nowrap;line-height:1.05;margin-top:2px}
.gift-card .value{font-size:37px;letter-spacing:-.035em;-webkit-text-stroke:4px #131723;paint-order:stroke fill;text-shadow:0 3px 0 #131723;color:#fff}.gift-card.negative .value{color:#ff3e43}
.gift-card .multiplier{font-size:17px;color:#fff;-webkit-text-stroke:2.5px #101522;paint-order:stroke fill}.gift-card.leaving{opacity:0;transform:translateY(-5px);transition:.15s}
.palette-label{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin:0 0 9px}.palette-label output{color:#bdeedc}
#character-colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:17px}
.color-choice{position:relative;height:32px;border:2px solid #ffffff55;border-radius:10px;background:var(--color);box-shadow:inset 0 3px 0 #ffffff55,inset 0 -3px 0 #071e3544}
.color-choice[aria-checked="true"]{border:3px solid #fff;outline:2px solid #9ff2d2;outline-offset:2px}.color-choice[aria-checked="true"]:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#102b3c;font-size:19px;text-shadow:0 1px #ffffff88}

#notice{position:absolute;z-index:7;left:7%;right:7%;bottom:97px;background:#fff8eaef;color:#527386;border-radius:12px;padding:8px 10px;font-size:10px;text-align:center;pointer-events:none}
#finish-card{position:absolute;z-index:3;top:213px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:18px;background:#fff2d0f2;border:3px solid #6c4c25;text-align:center;box-shadow:0 5px 0 #69472966,0 0 20px #ffdc9355;min-width:135px}
#finish-card small{display:block;font-size:10px;color:#77562e}#countdown{font-size:43px;color:#825222;line-height:1.12}
#victory{position:absolute;z-index:4;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff2c5;paint-order:stroke fill;-webkit-text-stroke:1.4px #755339;filter:drop-shadow(0 3px 0 #75533955)}
#victory canvas{display:block;width:80px;height:80px;margin:auto}#victory strong{display:block;font-size:35px;letter-spacing:.03em}#victory span{display:block;font-size:16px;letter-spacing:.1em}
#status{position:absolute;z-index:8;top:45%;left:50%;transform:translate(-50%,-50%);padding:14px 26px;background:#fff8e9ed;border:2px solid #fff;border-radius:21px;box-shadow:0 8px 30px #264b6633;font-size:19px;white-space:nowrap}
#loading{position:absolute;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#9ce3fa;color:#365c80}#loading strong{font-size:34px}
.loading-mark{display:grid;place-items:center;width:64px;height:64px;background:linear-gradient(#68d4e0,#788be0);border:3px solid #fff6e6;color:#fff6e6;border-radius:22px;font-size:44px;animation:float 1.3s ease-in-out infinite}#loading-copy{font-size:12px}
body.embedded .creator-only{display:none!important}
@keyframes card-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{50%{transform:translateY(-6px)}}
@media(max-width:390px){#hud{left:5%;right:5%}.brand{font-size:9px}.metrics{gap:11px;min-height:67px;margin-top:17px;margin-bottom:14px}#distance{font-size:58px}.wins-bubble canvas{width:25px;height:27px}.wins-bubble{padding-right:8px}.progress{height:34px}#remaining{font-size:10px;padding-right:28px}.finish-flag{width:38px;height:46px;top:-16px;right:-5px}#dock{left:10px;top:max(12px,env(safe-area-inset-top))}.dock-button{width:41px;height:41px}.dock-button svg{width:25px;height:25px}#game-menu{left:10px;width:calc(100% - 20px);max-width:320px;top:64px;max-height:calc(100% - 76px);padding:14px}#finish-card{top:192px}.distance-number{-webkit-text-stroke-width:3.7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important;transition-duration:0s!important}}
</style>

<body data-native-i18n>
  <main id="stage" tabindex="0" aria-label="Nova &amp; Vex" aria-keyshortcuts="ArrowLeft ArrowRight A D">
    <canvas id="scene" aria-label="Nova &amp; Vex game world"></canvas>
    <canvas id="hud-fx" aria-hidden="true"></canvas>
    <header id="hud"><div class="hud-heading"><div class="game-title"><span class="title-nova">NOVA</span> &amp; <span class="title-vex">VEX</span><small><span data-copy="tagline"></span></small></div><div class="brand" aria-label="TikInteract"><img src="../../assets/tikinteract-mark-digital.png" alt="" width="24" height="24"><span class="brand-name">TIK<span>INTERACT</span></span></div></div>
      <div class="metrics"><div class="distance-number"><span id="distance">0</span><span class="unit">m</span></div><div class="wins-bubble"><canvas id="trophy" width="80" height="80" aria-hidden="true"></canvas><strong id="wins">0</strong></div></div>
      <div class="progress"><div class="progress-track"><div id="progress-fill"></div></div><span id="remaining"></span><canvas id="finish-flag" class="finish-flag" width="96" height="112" aria-hidden="true"></canvas></div>
    </header>
    <div id="finish-card" hidden><small data-copy="hold"></small><strong id="countdown">10</strong></div>
    <div id="victory" hidden><canvas id="victory-cup" width="160" height="160" aria-hidden="true"></canvas><strong data-copy="victory"></strong><span id="victory-award"></span></div>
    <div id="status" hidden role="status"></div>
    <div id="feed" aria-live="polite"></div>
    <div id="notice" hidden role="status"></div>
    <div id="queue" hidden></div>
    <div id="biome"></div><div id="quick-test" class="creator-only" aria-label="Comenzi rapide de test"><span>TEST</span><button type="button" data-quick-action="cloud" title="Testează un cadou de urcare">Jetpack +150</button><button type="button" data-quick-action="meteor" title="Testează împingerea lui Vex">Vex −150</button><button type="button" data-quick-action="winRemove" title="Vex o trage de păr pe Nova">Vex</button></div>
    <aside id="game-menu" hidden aria-label="Meniu Nova &amp; Vex">
      <div class="menu-title"><div><div class="menu-brand"><img src="../../assets/tikinteract-mark-digital.png" alt="" width="16" height="16"><span class="brand-name">TIK<span>INTERACT</span></span></div><strong>Nova &amp; Vex</strong><small data-copy="settings"></small></div><button id="menu-close" type="button" aria-label="Închide meniul"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="menu-actions">
        <button id="sound" class="menu-action" aria-label="Sunet" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5m4 3c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg><span data-copy="audio"></span></button>
        <button id="pause" class="menu-action creator-only" aria-label="Pauză" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span id="pause-copy"></span></button>
      </div>
      <div class="menu-tabs creator-only">
        <button id="setup-toggle" aria-label="Setări" aria-expanded="true" aria-controls="setup-panel" data-copy="settings"></button>
        <button id="test-toggle" aria-label="Cadouri de test" aria-expanded="false" aria-controls="test-panel" data-copy="test"></button>
      </div>
    <section id="test-panel" class="panel creator-only" hidden>
      <h2 data-copy="test"></h2><div class="gift-test-fields"><div><label for="viewer" data-copy="viewer"></label><input id="viewer" value="@studio" maxlength="60" autocomplete="off"></div><div><label for="gift-quantity" data-copy="giftQuantity"></label><input id="gift-quantity" type="number" min="1" max="1000000" step="1" value="1" required></div></div>
      <div id="gift-buttons"></div>
    </section>
    <form id="setup-panel" class="panel creator-only">
      <section class="setting-group"><h2><canvas width="40" height="44" data-sprite="finish" aria-hidden="true"></canvas><span data-copy="round"></span></h2>
        <div class="field-grid"><div><label for="finish-input" data-copy="finish"></label><input id="finish-input" type="number" min="10" max="1000000" step="1" value="10000" required></div><div><label for="hold-input" data-copy="countdown"></label><input id="hold-input" type="number" min="1" max="120" step="1" value="10" required></div></div>
      </section>
      <section class="setting-group"><h2 data-copy="gameplay"></h2>
        <label class="switch-row"><span><strong data-copy="autoplay"></strong><small data-copy="autoHint"></small></span><input id="autoplay-input" type="checkbox"><i class="switch" aria-hidden="true"></i></label>
        <label class="switch-row"><span><strong data-copy="contributors"></strong><small data-copy="contributorsHint"></small></span><input id="contributors-input" type="checkbox" checked><i class="switch" aria-hidden="true"></i></label>
      </section>
      <section class="setting-group"><h2 data-copy="audio"></h2>
        <label class="switch-row"><span><strong data-copy="music"></strong></span><input id="music-input" type="checkbox" checked><i class="switch" aria-hidden="true"></i></label>
        <label class="range-label" for="fx-volume"><span data-copy="effectsVolume"></span><output id="fx-volume-value">55%</output></label><input id="fx-volume" type="range" min="0" max="100" value="55">
        <label class="range-label" for="music-volume"><span data-copy="musicVolume"></span><output id="music-volume-value">18%</output></label><input id="music-volume" type="range" min="0" max="100" value="18">
      </section>
      <section class="setting-group"><h2 data-copy="visuals"></h2>
        <div class="palette-label"><span data-copy="characterColor"></span><output id="character-color-value"></output></div>
        <div id="character-colors" role="radiogroup" aria-label="Culoarea personajului"></div>
        <label for="background-input" data-copy="background"></label><select id="background-input"><option value="Auto" data-copy="Auto"></option><option value="earth" data-copy="earth"></option><option value="grass" data-copy="grass"></option><option value="clouds" data-copy="clouds"></option><option value="space" data-copy="space"></option><option value="cosmos" data-copy="cosmos"></option><option value="lava" data-copy="lava"></option><option value="crystal" data-copy="crystal"></option><option value="abyss" data-copy="abyss"></option></select>
        <label class="range-label" for="detail-input"><span data-copy="particles"></span><output id="detail-input-value">80%</output></label><input id="detail-input" type="range" min="0" max="100" value="80">
        <label for="quality-input" data-copy="quality"></label><select id="quality-input"><option value="High" data-copy="high"></option><option value="Balanced" data-copy="balanced"></option><option value="Low" data-copy="low"></option></select>
        <label for="language" data-copy="language"></label><select id="language" aria-label="Language"><option value="ro">Română</option><option value="en">English</option></select>
      </section>
      <button type="submit" class="apply" data-copy="apply"></button>
    </form>
    </aside>
    <div id="loading"><div class="loading-brand"><img src="../../assets/tikinteract-mark-digital.png" alt="" width="56" height="56"><span class="brand-name">TIK<span>INTERACT</span></span></div><strong>Nova &amp; Vex</strong><span id="loading-copy" data-copy="loading"></span></div>
  </main>
